name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build self-contained map (inline Leaflet + data, sha256 verified)
        if: hashFiles('src/build.py') != ''
        run: |
          python3 src/build.py
          git rm -r -q src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "构建自包含地图页面（内联 Leaflet 与景点数据）"
          git push origin HEAD:main

      - name: Mirror site to gh-pages branch
        run: git push -f origin HEAD:gh-pages

      - name: Configure Pages (try to enable)
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: steps.pages.outcome == 'success'
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
