<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>深圳周边旅游景点地图</title>
<style>@@LEAFLET_CSS@@</style>
<style>@@MC_CSS@@@@MC_DEFAULT_CSS@@</style>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;color:#222}
#app{display:flex;height:100%}
#side{width:330px;min-width:330px;height:100%;display:flex;flex-direction:column;background:#fff;border-right:1px solid #ddd;z-index:1000;box-shadow:2px 0 8px rgba(0,0,0,.08)}
#side header{padding:14px 16px 10px;background:linear-gradient(135deg,#0b6e4f,#13a36e);color:#fff}
#side h1{margin:0;font-size:20px;letter-spacing:1px}
#side .sub{font-size:12px;opacity:.9;margin-top:4px}
#searchbox{padding:10px 12px 6px;border-bottom:1px solid #eee}
#q{width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-size:14px;outline:none}
#q:focus{border-color:#13a36e;box-shadow:0 0 0 2px rgba(19,163,110,.15)}
#types{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.chip{font-size:12px;padding:2px 8px;border-radius:12px;border:1px solid #bbb;background:#f6f6f6;cursor:pointer;user-select:none}
.chip.on{background:#13a36e;color:#fff;border-color:#13a36e}
#cities{padding:8px 12px;border-bottom:1px solid #eee}
#cities .tools{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#666;margin-bottom:4px}
#cities .tools a{color:#0b6e4f;cursor:pointer;margin-left:8px}
#citylist{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px}
.city{display:flex;align-items:center;font-size:13px;cursor:pointer;padding:2px 0}
.city input{margin:0 5px 0 0}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;border:1px solid rgba(0,0,0,.25);flex:none}
.cnt{color:#888;font-size:12px;margin-left:3px}
#listhead{padding:6px 12px;font-size:12px;color:#666;background:#fafafa;border-bottom:1px solid #eee}
#list{flex:1;overflow-y:auto}
.item{padding:7px 12px;border-bottom:1px solid #f0f0f0;cursor:pointer;display:flex;align-items:flex-start}
.item:hover{background:#f2faf6}
.item .nm{font-size:14px;font-weight:600}
.item .meta{font-size:12px;color:#777;margin-top:1px}
.item .dot{margin-top:4px}
.pin{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.pin span{display:block;transform:rotate(45deg);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:700}
.ccl{border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;border:3px solid rgba(255,255,255,.85);box-shadow:0 1px 5px rgba(0,0,0,.4);font-size:13px}
.leaflet-popup-content{margin:12px 14px;min-width:230px}
.pp h3{margin:0 0 6px;font-size:16px}
.pp .tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:10px;color:#fff;margin-right:4px}
.pp .tag.t{background:#666}
.pp table{border-collapse:collapse;font-size:13px;margin:6px 0}
.pp td{padding:2px 4px;vertical-align:top}
.pp td:first-child{color:#888;white-space:nowrap}
.pp .intro{font-size:13px;line-height:1.5;margin:4px 0 8px}
.pp .links a{display:inline-block;font-size:12px;margin-right:6px;padding:3px 8px;border-radius:4px;background:#eef6f2;color:#0b6e4f;text-decoration:none;border:1px solid #cfe6db}
.pp .links a:hover{background:#dff0e8}
#note{font-size:11px;color:#999;padding:6px 12px;border-top:1px solid #eee}
#toggle{display:none}
@media (max-width:760px){
 #side{position:absolute;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s}
 #side.open{transform:none}
 #toggle{display:block;position:absolute;top:10px;left:56px;z-index:1100;background:#13a36e;color:#fff;border:none;border-radius:6px;padding:8px 12px;font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
}
#map{flex:1;height:100%}
</style>
</head>
<body>
<div id="app">
 <aside id="side">
  <header><h1>深圳周边旅游景点地图</h1><div class="sub" id="sub"></div></header>
  <div id="searchbox">
   <input id="q" type="search" placeholder="搜索景点名称 / 简介关键词…">
   <div id="types"></div>
  </div>
  <div id="cities">
   <div class="tools"><span>按城市显示</span><span><a id="all">全选</a><a id="none">全不选</a></span></div>
   <div id="citylist"></div>
  </div>
  <div id="listhead"></div>
  <div id="list"></div>
  <div id="note">坐标来源：OpenStreetMap（WGS84）。门票为大致参考价，请以景区官方公布为准。</div>
 </aside>
 <button id="toggle">☰ 景点列表</button>
 <div id="map"></div>
</div>
<script>@@LEAFLET_JS@@</script>
<script>@@MC_JS@@</script>
<script>
const DATA = @@DATA@@;
const CITY_ORDER = ["深圳", "东莞", "惠州", "广州", "佛山", "中山", "珠海", "江门", "汕尾", "河源", "清远", "肇庆", "香港", "澳门"];
const COLORS = {"深圳": "#e6194b", "东莞": "#f58231", "惠州": "#3cb44b", "广州": "#4363d8", "佛山": "#911eb4", "中山": "#c99a00", "珠海": "#00a3a3", "江门": "#9a6324", "汕尾": "#f032e6", "河源": "#2e7d32", "清远": "#6b8e23", "肇庆": "#800000", "香港": "#000075", "澳门": "#ff6f61"};

// ---- WGS84 -> GCJ-02 (for 高德 tiles) ----
const PI=Math.PI, AX=6378245.0, EE=0.00669342162296594323;
function tLat(x,y){let r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;r+=(20*Math.sin(y*PI)+40*Math.sin(y/3*PI))*2/3;r+=(160*Math.sin(y/12*PI)+320*Math.sin(y*PI/30))*2/3;return r;}
function tLon(x,y){let r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;r+=(20*Math.sin(x*PI)+40*Math.sin(x/3*PI))*2/3;r+=(150*Math.sin(x/12*PI)+300*Math.sin(x/30*PI))*2/3;return r;}
function wgs2gcj(lat,lon){let dLat=tLat(lon-105,lat-35),dLon=tLon(lon-105,lat-35);const rad=lat/180*PI;let m=Math.sin(rad);m=1-EE*m*m;const s=Math.sqrt(m);dLat=(dLat*180)/((AX*(1-EE))/(m*s)*PI);dLon=(dLon*180)/(AX/s*Math.cos(rad)*PI);return [lat+dLat,lon+dLon];}

const map = L.map('map',{zoomControl:true,zoomSnap:0.25,preferCanvas:false});
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 贡献者'});
const amap = L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{subdomains:'1234',maxZoom:18,attribution:'&copy; 高德地图'});
const hot = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',{subdomains:'abc',maxZoom:19,attribution:'&copy; OpenStreetMap 贡献者, 瓦片 HOT / OSM France'});
osm.addTo(map);
// 以深圳为中心、覆盖全部景点（珠三角及周边）
const SZ=[22.60,114.05];
let dLat=0,dLon=0;DATA.forEach(d=>{dLat=Math.max(dLat,Math.abs(d.lat-SZ[0]));dLon=Math.max(dLon,Math.abs(d.lon-SZ[1]));});
function home(){map.fitBounds([[SZ[0]-dLat,SZ[1]-dLon],[SZ[0]+dLat,SZ[1]+dLon]],{padding:[10,10]});}
home();
let useGcj=false;

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function pos(d){return useGcj?wgs2gcj(d.lat,d.lon):[d.lat,d.lon];}
const TYPE_ICON={"自然风光":"山","主题乐园":"乐","历史文化":"史","城市地标":"城","海滨海岛":"海","古镇古村":"村"};
function icon(d){return L.divIcon({className:'',html:`<div class="pin" style="background:${COLORS[d.city]}"><span>${TYPE_ICON[d.type]||'景'}</span></div>`,iconSize:[22,22],iconAnchor:[11,24],popupAnchor:[0,-22]});}
function popup(d){
 const kw=encodeURIComponent((d.city==='香港'||d.city==='澳门'?d.city:d.city+'市')+' '+d.name.replace(/（.*?）/g,''));
 const nm=encodeURIComponent(d.name);
 return `<div class="pp"><h3>${esc(d.name)}</h3>
 <span class="tag" style="background:${COLORS[d.city]}">${esc(d.city)}</span><span class="tag t">${esc(d.type)}</span>
 <table><tr><td>A级评定</td><td>${esc(d.rating||'—')}</td></tr>
 ${d.ticket?`<tr><td>门票参考</td><td>${esc(d.ticket)}</td></tr>`:''}
 <tr><td>坐标</td><td>${d.lat.toFixed(5)}, ${d.lon.toFixed(5)}</td></tr></table>
 <div class="intro">${esc(d.intro)}</div>
 <div class="links"><a target="_blank" rel="noopener" href="https://uri.amap.com/search?keyword=${kw}">高德地图搜索</a><a target="_blank" rel="noopener" href="https://uri.amap.com/marker?position=${d.lon},${d.lat}&name=${nm}&coordinate=wgs84&callnative=0">高德定位</a><a target="_blank" rel="noopener" href="https://map.baidu.com/search/${kw}">百度地图</a></div></div>`;
}

const groups={}, markers=[];
CITY_ORDER.forEach(c=>{
 groups[c]=L.markerClusterGroup({showCoverageOnHover:false,maxClusterRadius:40,disableClusteringAtZoom:13,spiderfyOnMaxZoom:true,
  iconCreateFunction:cl=>{const n=cl.getChildCount();const sz=n<5?30:n<10?36:42;return L.divIcon({className:'',html:`<div class="ccl" style="width:${sz}px;height:${sz}px;background:${COLORS[c]}">${n}</div>`,iconSize:[sz,sz]});}});
 groups[c].addTo(map);
});
DATA.forEach((d,i)=>{const m=L.marker(pos(d),{icon:icon(d),title:d.name});m.bindPopup(popup(d),{maxWidth:300});m.bindTooltip(d.name,{direction:'top',offset:[0,-20]});m._d=d;d._m=m;markers.push(m);});

const types=[...new Set(DATA.map(d=>d.type))];
const typeOn=new Set(types), cityOn=new Set(CITY_ORDER);
document.getElementById('sub').textContent=`共 ${DATA.length} 个景点 · ${CITY_ORDER.length} 个城市 · 点击标记查看详情`;
const tbox=document.getElementById('types');
types.forEach(t=>{const s=document.createElement('span');s.className='chip on';s.textContent=t;s.onclick=()=>{typeOn.has(t)?typeOn.delete(t):typeOn.add(t);s.classList.toggle('on');refresh();};tbox.appendChild(s);});
const cl=document.getElementById('citylist');
const cnt={};DATA.forEach(d=>cnt[d.city]=(cnt[d.city]||0)+1);
CITY_ORDER.forEach(c=>{const l=document.createElement('label');l.className='city';l.innerHTML=`<input type="checkbox" checked data-c="${c}"><span class="dot" style="background:${COLORS[c]}"></span>${c}<span class="cnt">(${cnt[c]||0})</span>`;l.querySelector('input').onchange=e=>{e.target.checked?cityOn.add(c):cityOn.delete(c);refresh();};cl.appendChild(l);});
document.getElementById('all').onclick=()=>{CITY_ORDER.forEach(c=>cityOn.add(c));cl.querySelectorAll('input').forEach(i=>i.checked=true);refresh();};
document.getElementById('none').onclick=()=>{cityOn.clear();cl.querySelectorAll('input').forEach(i=>i.checked=false);refresh();};
const qEl=document.getElementById('q');qEl.oninput=()=>refresh();

function visible(d){const q=qEl.value.trim().toLowerCase();return cityOn.has(d.city)&&typeOn.has(d.type)&&(!q||d.name.toLowerCase().includes(q)||d.intro.toLowerCase().includes(q)||d.type.includes(q)||d.city.includes(q));}
function refresh(){
 CITY_ORDER.forEach(c=>groups[c].clearLayers());
 const vis=DATA.filter(visible);
 const byCity={};vis.forEach(d=>{(byCity[d.city]=byCity[d.city]||[]).push(d._m);});
 Object.keys(byCity).forEach(c=>groups[c].addLayers(byCity[c]));
 document.getElementById('listhead').textContent=`当前显示 ${vis.length} / ${DATA.length} 个景点`;
 const list=document.getElementById('list');list.innerHTML='';
 vis.forEach(d=>{const it=document.createElement('div');it.className='item';it.innerHTML=`<span class="dot" style="background:${COLORS[d.city]}"></span><div><div class="nm">${esc(d.name)}</div><div class="meta">${esc(d.city)} · ${esc(d.type)}${d.rating?' · '+esc(d.rating.replace(/（.*）/,'')):''}</div></div>`;it.onclick=()=>{groups[d.city].zoomToShowLayer(d._m,()=>d._m.openPopup());if(innerWidth<760)side.classList.remove('open');};list.appendChild(it);});
 if(qEl.value.trim()&&vis.length&&vis.length<=20){map.fitBounds(L.latLngBounds(vis.map(pos)).pad(0.3),{maxZoom:13});}
}
refresh();

L.control.layers({'OpenStreetMap 标准地图':osm,'OSM 人道主义风格（备用）':hot,'高德地图（中文，自动纠偏）':amap},null,{collapsed:false,position:'topright'}).addTo(map);
map.on('baselayerchange',e=>{const was=useGcj;useGcj=(e.layer===amap);if(was!==useGcj){const c=map.getCenter(),g=wgs2gcj(c.lat,c.lng);const nc=useGcj?g:[2*c.lat-g[0],2*c.lng-g[1]];map.panTo(nc,{animate:false});}markers.forEach(m=>m.setLatLng(pos(m._d)));CITY_ORDER.forEach(c=>{if(map.hasLayer(groups[c])){groups[c].refreshClusters();}});refresh();});
L.control.scale({imperial:false}).addTo(map);

const Home=L.Control.extend({onAdd(){const b=L.DomUtil.create('a','leaflet-bar');b.href='#';b.title='回到全览';b.innerHTML='⌂';b.style.cssText='width:30px;height:30px;line-height:30px;text-align:center;background:#fff;font-size:18px;color:#333;text-decoration:none';b.onclick=e=>{e.preventDefault();home();};return b;}});
new Home({position:'topleft'}).addTo(map);
const side=document.getElementById('side');document.getElementById('toggle').onclick=()=>side.classList.toggle('open');
</script>
</body>
</html>
